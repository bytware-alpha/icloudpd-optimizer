[package]
name = "icloudpd-optimizer"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Fail-closed iCloudPD RAW optimization helper"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bytware-alpha/icloudpd-optimizer"
keywords = ["icloud", "icloudpd", "photos", "raw", "heic"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Audited from crates.io smb2 0.13.0. The local security patch retains exact
# SESSION_SETUP flags for pre-TREE_CONNECT guest/null rejection and zeroizes
# bounded authentication, derived-session, and connection crypto key copies.
# It also binds connection diagnostics only after successful session setup.
smb2 = { version = "=0.13.0", path = "vendor/smb2-0.13.0" }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
zeroize = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
assert_cmd = "2"
filetime = "0.2"
predicates = "3"
tempfile = "3"
